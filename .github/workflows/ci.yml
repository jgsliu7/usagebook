name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows 测试尚未修绿(平台差异排查中,暂无实机环境):降为非阻塞,
    # 失败保持可见但不拖垮整条 CI,其余平台继续作为合入闸门。
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build (release)
        run: cargo build --release --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Check third-party license inventory
        if: runner.os == 'Linux'
        run: python3 scripts/collect_licenses.py --check

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.85
      - run: cargo check --workspace --all-targets --locked
