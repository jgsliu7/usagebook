<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">usagebook 看板</title>
<script src="/vendor/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel2: #171c27;
    --border: #232a38;
    --fg: #e8edf5;
    --muted: #93a0b4;
    --dim: #8290a6;   /* 2026-10-17 UX:对 panel 底 4.6:1,达 WCAG AA(原 #6b7689 为 3.95:1) */
    --accent: #6cb6ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.6 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    padding: 0 20px 48px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }

  header {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px 16px;
    padding: 22px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .header-summary { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .header-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 12px 16px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header h1 .logo { color: var(--accent); }
  .header-status { display: flex; flex-direction: column; flex: 0 0 148px; width: 148px; height: 38px; min-width: 0; color: var(--muted); font-size: 12.5px; line-height: 18px; }
  #status { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #refresh-countdown { white-space: nowrap; font-variant-numeric: tabular-nums; }
  #btn-refresh {
    background: var(--panel2); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 14px; font-size: 13px; cursor: pointer; flex: 0 0 128px; width: 128px; height: 32px; line-height: 18px; white-space: nowrap;
  }
  #btn-refresh:hover { border-color: var(--accent); color: var(--accent); }
  #btn-refresh:disabled { opacity: .5; cursor: wait; }
  .arf-wrap { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
  #status.st-scan { color: var(--accent); }
  @media (max-width: 1100px) {
    header { grid-template-columns: minmax(0, 1fr); }
    .header-actions { width: 100%; }
  }

  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(136px, 1fr));
    gap: 10px; margin-bottom: 18px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; min-width: 0;
  }
  .card .k { color: var(--muted); font-size: 11.5px; letter-spacing: .8px; }
  .card .v { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .card .sub { color: var(--dim); font-size: 11px; margin-top: 1px; }
  /* 同比方向片(2026-10-21):涨绿跌红(GitHub dark 语义色,刻意不用 codex/minimax 来源色防撞图例);
     三角缩一号;方向语义由 +/- 承载,三角对读屏隐藏(aria-hidden) */
  .card .delta { font-variant-numeric: tabular-nums; }
  .card .delta.up { color: #3fb950; }
  .card .delta.down { color: #f85149; }
  .card .delta [aria-hidden] { font-size: 9px; }
  .card.hl { border-color: #2c4a6e; background: linear-gradient(160deg, #12161f 60%, #14203a); }
  .card.hl .v { color: var(--accent); }

  .controls {
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    margin-bottom: 14px; color: var(--muted); font-size: 13px;
  }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { white-space: nowrap;
    background: transparent; color: var(--muted); border: none;
    padding: 5px 12px; font-size: 12.5px; cursor: pointer; border-right: 1px solid var(--border);
  }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: #1d2b45; color: var(--fg); }
  .seg button:hover:not(.on) { color: var(--fg); }   /* 可点性指示(2026-10-17 UX) */
  input[type="date"] {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 10px; font-size: 12.5px; color-scheme: dark;
  }

  /* 多选下拉(来源/模型,数量会增长到二三十个) */
  .ms-wrap { position: relative; display: inline-flex; align-items: center; gap: 6px; }
  .ms-btn.filter-on { border-color: var(--accent); color: var(--accent); }
  .ms-btn {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 10px; font-size: 12.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; max-width: 260px;
  }
  .ms-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ms-btn .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-btn .cnt { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .ms-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.45); padding: 8px; min-width: 250px; max-width: 330px;
  }
  .ms-head { display: flex; gap: 6px; margin-bottom: 6px; }
  .ms-head input {
    flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 12px; min-width: 0;
  }
  .ms-act {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 11.5px; cursor: pointer; white-space: nowrap;
  }
  .ms-act:hover { color: var(--accent); border-color: var(--accent); }
  .ms-list { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; }
  .ms-item {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px;
    cursor: pointer; font-size: 12.5px; user-select: none; color: var(--fg);
  }
  .ms-item:hover { background: #1d2b45; }
  .ms-item input { accent-color: var(--accent); margin: 0; }
  .ms-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-item .share { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .srcrow, .mrow { cursor: pointer; }
  .srcrow:focus-visible, .mrow:focus-visible { background: #1d2b45; }   /* 键盘走查焦点可见 */
  /* 明细行 solo 态(2026-10-19):选中行高亮(优先级高于 tr:hover 通用底色),未选中行灰显不消失;
     模型表先行,来源表同日扩展同款 */
  .srcrow.solo-on td, .mrow.solo-on td { background: #1d2b45; }
  .srcrow.solo-on .mname, .mrow.solo-on .mname { color: var(--accent); }
  .srcrow.solo-off, .mrow.solo-off { opacity: .42; }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 16px; min-width: 0;
  }
  .p-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
  .p-head h2 { margin: 0; font-size: 14px; color: var(--fg); font-weight: 600; }
  .p-head h2 small { color: var(--dim); font-weight: 400; margin-left: 8px; font-size: 12px; }
  .p-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hbtn {
    background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .hbtn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  .hbtn:disabled { opacity: .35; cursor: default; }
  .day-entry { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
  .chart-box { position: relative; }
  /* grid2 图表容器固定高:斩断 aspectRatio 高度拉锯与 899/901px 尺寸悬崖;
     环的水平居中交给 Chart.js 原生 chartArea 布局(flex 实测反而致半宽布局,已回退) */
  #grid2 .chart-box { height: 320px; }
  #chartDaily { height: 320px; }
  #chartHourly { height: 320px; }
  #daily-view { flex: 0 0 auto; }
  #daily-view button { min-width: 54px; }
  #daily3d-tools { display: inline-flex; gap: 4px; align-items: center; }
  #daily3d-tools[hidden] { display: none; }
  #daily3d-tools .hbtn { min-width: 29px; padding: 3px 7px; }
  #daily3d { position: relative; }
  #daily3d-stage { height: 378px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 55%,rgba(44,74,110,.13),transparent 62%); }
  #daily3d-stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #daily3d-stage canvas:active { cursor: grabbing; }
  .daily3d-legend { min-height: 32px; padding-top: 8px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 12px; }
  .daily3d-legend button { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 32px; padding: 4px 6px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: inherit; font: inherit; text-align: left; overflow-wrap: anywhere; cursor: pointer; }
  .daily3d-legend button:hover { color: var(--fg); background: var(--panel2); }
  .daily3d-legend button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .daily3d-legend button[aria-pressed="false"] { opacity: .5; text-decoration: line-through; }
  .daily3d-legend i { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 2px; }
  .daily3d-tooltip { position: fixed; z-index: 100; min-width: min(138px,calc(100vw - 16px)); max-width: calc(100vw - 16px); box-sizing: border-box; overflow-wrap: anywhere; padding: 9px 11px; pointer-events: none; border: 1px solid #3b526b; border-radius: 7px; background: rgba(18,25,36,.97); box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .daily3d-tooltip span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 5px; }
  .daily3d-tooltip strong { display: flex; align-items: center; gap: 6px; color: var(--fg); font-size: 12px; font-weight: 500; }
  .daily3d-tooltip strong i { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 2px; }
  .daily3d-tooltip b { display: block; color: var(--accent); font-size: 18px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) { #daily3d-stage { height: 328px; } .daily3d-legend button { min-height: 40px; } }

  .grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
  .grid2.single { grid-template-columns: 1fr; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } #seg-range { flex-wrap: wrap; } }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 10px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--border); }
  td { border-bottom: 1px solid #1a2029; font-size: 13px; }
  tr:hover td { background: #151b27; }
  .mname { font-weight: 570; }
  .srcdot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
  .share-cell { position: relative; min-width: 120px; }
  .share-bar { position: absolute; left: 0; top: 15%; bottom: 15%; background: #1d2b45; border-radius: 3px; }
  .share-txt { position: relative; }
  .empty-tip { color: var(--dim); font-size: 12.5px; padding: 18px 0; text-align: center; }

  /* 口径说明紧凑列表 */
  footer ul.caliber { margin: 6px 0 0; padding-left: 0; list-style: none; color: var(--dim); font-size: 12px; line-height: 1.8; }
  footer ul.caliber li { margin: 0; }
  footer ul.caliber b { color: var(--fg); margin-right: 4px; }
  footer { color: var(--dim); font-size: 12px; line-height: 1.8; margin-top: 8px; }
  footer b { color: var(--muted); }
  #scanning { text-align: center; color: var(--muted); padding: 80px 0; font-size: 15px; }
  .dot-loading::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% {content:'';} 25% {content:'.';} 50% {content:'..';} 75% {content:'...';} }
  .chart-fallback { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-summary">
    <h1 title=""><span class="logo">▸</span> usagebook <span style="color:var(--muted);font-weight:400" data-i18n="brand.sub">本机 Token 用量看板</span></h1>
    <span class="header-status">
      <span id="status" aria-live="polite"><span class="st-meta" data-i18n="status.connecting">连接中…</span></span>
      <span id="refresh-countdown" hidden></span>
    </span>
    </div>
    <div class="header-actions">
    <span class="arf-wrap"><span data-i18n="lbl.lang">语言</span>
      <span class="seg" id="seg-lang">
        <button data-v="zh-CN" class="on">中文</button><button data-v="en-US">EN</button>
      </span>
    </span>
    <span class="arf-wrap"><span data-i18n="lbl.unit">单位</span>
      <span class="seg" id="seg-unit" data-i18n-title="unit.tip">
        <button data-v="zh" class="on">万/亿</button><button data-v="en">K/M/B</button>
      </span>
    </span>
    <span class="arf-wrap"><span data-i18n="lbl.arf">页面更新</span>
      <span class="seg" id="seg-arf">
        <button data-v="20">20s</button>
        <button data-v="30" class="on">30s</button><button data-v="60" data-i18n="arf.1m">1分</button>
        <button data-v="0" data-i18n="arf.off">关</button>
      </span>
    </span>
    <button id="btn-refresh" data-i18n="btn.refresh">↻ 立即刷新</button>
    <button id="clear-model-filter" class="hbtn" hidden></button>
    </div>
  </header>

  <div id="scanning" aria-live="polite"><span id="scanning-txt" data-i18n="data.loading">正在读取统计…</span><span class="dot-loading"></span></div>
  <div id="app" hidden>
    <div class="cards" id="cards"></div>
    <div id="ledger-note" class="st-warn" role="status" hidden style="color:#f2cc60;margin:0 0 12px;font-size:12px"></div>
    <div class="controls">
      <span class="ms-wrap"><span data-i18n="lbl.source">来源</span>
        <button class="ms-btn" id="src-ms-btn"><span class="lbl" data-i18n="ms.allSrc">全部来源</span> <span class="cnt">▾</span></button>
        <div class="ms-panel" id="src-ms-panel" hidden></div>
      </span>
      <span class="ms-wrap"><span data-i18n="lbl.model">模型</span>
        <button class="ms-btn" id="mdl-ms-btn"><span class="lbl" data-i18n="ms.allMdl">全部模型</span> <span class="cnt">▾</span></button>
        <div class="ms-panel" id="mdl-ms-panel" hidden></div>
      </span>
      <span><span data-i18n="lbl.time">时间</span>
        <span class="seg" id="seg-range">
          <button data-v="today" class="on" data-i18n="seg.today">今天</button><button data-v="yesterday" data-i18n="seg.yesterday">昨天</button>
          <button data-v="thisweek" data-i18n="seg.thisweek">本周</button><button data-v="lastweek" data-i18n="seg.lastweek">上周</button>
          <button data-v="thismonth" data-i18n="seg.thismonth">本月</button><button data-v="lastmonth" data-i18n="seg.lastmonth">上月</button>
          <button data-v="d7" data-i18n="seg.d7">7天</button><button data-v="d14" data-i18n="seg.d14">14天</button>
          <button data-v="d30" data-i18n="seg.d30">30天</button><button data-v="d90" data-i18n="seg.d90">90天</button>
          <button data-v="all" data-i18n="seg.all">全部</button><button data-v="custom" data-i18n="seg.custom">自定义</button>
        </span>
      </span>
      <span id="custom-range" hidden>
        <input type="date" id="rs-pick"> ~ <input type="date" id="re-pick">
      </span>
      <span><span data-i18n="lbl.metric">指标</span>
        <span class="seg" id="seg-metric">
          <button data-v="total" class="on" data-i18n="seg.mTotal">总量</button><button data-v="input" data-i18n="seg.mInput">新输入</button>
          <button data-v="cr" data-i18n="seg.mCr">缓存读</button><button data-v="cw" data-i18n="seg.mCw">缓存写</button>
          <button data-v="output" data-i18n="seg.mOutput">输出</button><button data-v="reason" data-i18n="seg.mReason">推理</button>
        </span>
      </span>
      <span><span data-i18n="lbl.group">分组</span>
        <span class="seg" id="seg-group">
          <button data-v="source" class="on" data-i18n="seg.gSrc">按来源</button><button data-v="model" data-i18n="seg.gMdl">按模型</button>
        </span>
      </span>
    </div>

    <div class="panel">
      <div class="p-head">
        <!-- data-i18n 仅为首帧兜底;真实标题由 renderDaily/renderDayView/renderPeriodTrend 按模式覆写,勿据此推断语义 -->
        <h2><span id="daily-h2" data-i18n="h2.daily">每日 Token 消耗</span><small id="daily-sub"></small></h2>
        <span class="p-tools">
          <span class="seg" id="daily-view" aria-label="视图">
            <button data-v="3d">3D</button><button data-v="standard" class="on" data-i18n="view.standard">标准</button>
          </span>
          <span id="daily3d-tools" hidden>
            <button class="hbtn" id="daily3d-reset" data-i18n-title="view.reset" title="默认视角">◎</button>
            <button class="hbtn" id="daily3d-top" data-i18n-title="view.top" title="俯视"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 3h10v10H3zM3 8h10M8 3v10"/></svg></button>
            <button class="hbtn" id="daily3d-left" data-i18n-title="view.left" title="向左旋转">‹</button>
            <button class="hbtn" id="daily3d-right" data-i18n-title="view.right" title="向右旋转">›</button>
            <button class="hbtn" id="daily3d-zoom-in" data-i18n-title="view.zoomIn" title="放大">+</button>
            <button class="hbtn" id="daily3d-zoom-out" data-i18n-title="view.zoomOut" title="缩小">−</button>
            <button class="hbtn" id="daily3d-auto" data-i18n-title="view.auto" title="自动巡游">▶</button>
          </span>
          <span class="day-entry" id="dayview-bar">
            <button class="hbtn" id="day-back" hidden>‹ <span data-i18n="btn.backToday">返回今天</span></button>
            <button class="hbtn" id="day-prev" hidden>‹</button>
            <input type="date" id="day-pick">
            <button class="hbtn" id="day-next" hidden>›</button>
          </span>
        </span>
      </div>
      <div class="chart-box"><canvas id="chartDaily" aria-hidden="true"></canvas><div id="daily3d" hidden><div id="daily3d-stage"></div><div id="daily3d-legend" class="daily3d-legend"></div></div></div>
    </div>

    <div class="grid2" id="grid2">
      <div class="panel" id="hourly-panel">
        <!-- 同 daily-h2:标题由 render 按模式覆写(小时分布/周趋势/月趋势),data-i18n 仅首帧兜底 -->
        <div class="p-head"><h2><span id="hourly-h2" data-i18n="h2.hourly">当日按小时分布</span><small id="hourly-sub"></small></h2></div>
        <div class="chart-box"><canvas id="chartHourly" aria-hidden="true"></canvas></div>
      </div>
      <div class="panel">
        <div class="p-head"><h2><span id="doughnut-h2" data-i18n="h2.sourceShare">来源占比</span></h2></div>
        <div class="chart-box"><canvas id="chartSource" aria-hidden="true"></canvas><div class="empty-tip" id="doughnut-empty" hidden data-i18n="empty.noSel">当前口径下无数据</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="p-head">
        <h2 data-i18n="h2.modelTbl">模型明细</h2>
      </div>
      <div style="overflow-x:auto"><table id="tbl-model"></table></div>
      <div id="more-model" aria-hidden="true" hidden style="height:1px"></div>
    </div>

    <div class="panel">
      <div class="p-head">
        <h2 data-i18n="h2.sourceTbl">来源明细</h2>
      </div>
      <div style="overflow-x:auto"><table id="tbl-source"></table></div>
      <div id="more-source" aria-hidden="true" hidden style="height:1px"></div>
    </div>

    <footer>
      <span id="ver" style="float:right;color:var(--dim);font-size:11px"></span>
      <b data-i18n="footer.title">口径说明</b>
      <ul class="caliber">

    // 修:取 chartArea 几何中心(而非首个扇形坐标)——首帧布局未稳/滚动条
    // 出现导致重排时,扇形元数据是旧布局的,文字会偏;几何中心永远自洽
    const x = (a.left + a.right) / 2, y = (a.top + a.bottom) / 2;
    const ctx = chart.ctx;
    const font = getComputedStyle(document.body).fontFamily;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e8edf5';
    ctx.font = '600 16px ' + font;
    ctx.fillText(chart.$center.v, x, y - 4);
    ctx.fillStyle = '#93a0b4';
    ctx.font = '11px ' + font;
    ctx.fillText(chart.$center.l, x, y + 14);
    ctx.restore();
  }
};

const _tblKeys = { 'tbl-model': null, 'tbl-source': null };
function tblMemoKey() {
  return [DATA.view_generation, localDayStr(), state.win, state.rs, state.re, _selKey(state.srcSel), _selKey(state.mdlSel), state.metric, state.group, state.unit, state.lang].join('|');
}
function setTableHTML(elId, html) {
  const key = tblMemoKey();
  if (key === _tblKeys[elId]) return false;
  const el = document.getElementById(elId);
  /* 焦点保持(2026-10-19 交互审计):innerHTML 重建会把焦点行销毁、焦点丢回 body——
     重建前记下焦点行的实体键,重建后同键行还在则焦点接回(Tab 走查不再被周期刷新打断) */
  const ae = document.activeElement;
  let focusSel = null;
  if (ae && el.contains(ae)) {
    const tr = ae.closest('tr.mrow, tr.srcrow');
    if (tr) focusSel = tr.dataset.m != null ? `tr.mrow[data-m="${CSS.escape(tr.dataset.m)}"]` : `tr.srcrow[data-s="${CSS.escape(tr.dataset.s)}"]`;
  }
  el.innerHTML = html;
  _tblKeys[elId] = key;
  if (focusSel) { const tr = el.querySelector(focusSel); if (tr) tr.focus(); }
  return true;
}

/* ---------------- 多选下拉(来源/模型同款交互) ---------------- */
function persist(k, sel, solo = null) {
  const exact=k===MDL_LS_KEY&&!!sel?.exclude;
  const selector=sel?{mode:sel.exclude?(exact?'exclude_exact':'exclude'):'include',ids:[...sel]}:{mode:'all'};
  const intent=solo===null?{mode:'ordinary'}:{mode:'solo',id:solo};
  try { localStorage.setItem(k, JSON.stringify({version:exact?2:1,selector,intent})); return true; } catch (e) {return false;}
}
function setSelection(dim, sel, solo = null, userChange = false) {
  if(sel!==null&&typeof validateSelection==='function'&&!validateSelection(dim,sel))return false;
  const before=userChange?queryIntentKey():null,source=dim==='source';
  state[source?'srcSel':'mdlSel']=sel;
  state[source?'srcSolo':'mdlSolo']=solo;
  if(!persist(source?SRC_LS_KEY:MDL_LS_KEY,sel,solo)&&typeof showSelectionIssue==='function')showSelectionIssue('storage',dim);
  else if(typeof clearSelectionIssue==='function'){
    clearSelectionIssue('storage',dim);
    if(userChange){clearSelectionIssue('protocol',dim);clearSelectionIssue('limit',dim);}
  }
  if(userChange&&before!==queryIntentKey())resetChartIntent();
  return true;
}
function restoreSelection(dim) {
  const source=dim==='source',value=JSON.parse(lsGet(source?SRC_LS_KEY:MDL_LS_KEY)||'null');
  let stored=value,solo=null;
  const versioned=value&&Object.prototype.hasOwnProperty.call(value,'version');
  if(versioned){
    if(![1,2].includes(value.version)||!value.selector||!value.intent||!['ordinary','solo'].includes(value.intent.mode))return;
    stored=value.selector;
  }else if(Array.isArray(value))stored={mode:'include',ids:value};
  if(stored===null)return;
  if(!stored||!['all','include','exclude','exclude_exact'].includes(stored.mode)||source&&stored.mode==='exclude_exact')return;
  if(versioned&&(value.version===2&&stored.mode!=='exclude_exact'||value.version===1&&stored.mode==='exclude_exact'))return;
  if(stored.mode!=='all'&&(!Array.isArray(stored.ids)||!stored.ids.every(id=>typeof id==='string')))return;
  const sel=stored.mode==='all'?null:new Set(stored.ids);
  if(sel)sel.exclude=stored.mode==='exclude'||stored.mode==='exclude_exact';
  if(versioned&&value.intent.mode==='solo'){
    if(typeof value.intent.id!=='string'||!sel||sel.exclude||sel.size!==1||!sel.has(value.intent.id))return;
    solo=value.intent.id;
  }else if(!versioned&&sel&&!sel.exclude&&sel.size===1)solo=[...sel][0];
  state[source?'srcSel':'mdlSel']=sel;
  state[source?'srcSolo':'mdlSolo']=solo;
}
/* 单项切换:勾满全部 → 回"全部";取消到空集 → 显式保持空(配合"全不选",便于再挑一两个) */
function toggleSel(sel, ids, v, complete=false) {
  if(!sel){const next=new Set([v]);next.exclude=true;return next;}
  if(sel.exclude){const next=new Set(sel);next.exclude=true;next.has(v)?next.delete(v):next.add(v);return next.size?next:null;}
  sel=new Set(sel);
  sel.has(v) ? sel.delete(v) : sel.add(v);
  return complete&&ids.length&&sel.size===ids.length&&ids.every(id=>sel.has(id)) ? null : sel;
}
function toggleSrc(s) {
  setSelection('source',toggleSel(state.srcSel, allSrcIds(), s, catalogComplete('source')),null,true);
  render();   // 打开中的面板由 render 末尾的 refreshOpenPanels 按焦点策略刷新
}
function toggleMdl(m) {
  setSelection('model',toggleSel(state.mdlSel, allMdlIds(), m, catalogComplete('model')),null,true);
  render();
}
/* 表行 solo(2026-10-19 交互改版):点行=只看该模型;再点同一行(或它已是唯一选中)恢复全部。
   selector 与固定目标一起保存；目录增长不能扩大这次操作选定的范围。 */
function soloMdl(m) {
  const cur = state.mdlSel;
  const clear=cur&&!cur.exclude&&cur.size===1&&cur.has(m);
  setSelection('model',clear?null:new Set([m]),clear?null:m,true);
  render();
}
/* 来源表行同款 solo(同日扩展):语义与 soloMdl 完全对称 */
function soloSrc(s) {
  const cur = state.srcSel;
  const clear=cur&&!cur.exclude&&cur.size===1&&cur.has(s);
  setSelection('source',clear?null:new Set([s]),clear?null:s,true);
  render();
}


/* ---------------- 交互 ---------------- */
/* seg 按钮组高亮同步:pred(data-v) 为真者 on(四个 setXUi 共用同一视觉语义) */
const segSync = (sel, pred) => $(sel).querySelectorAll('button')
  .forEach(b => b.classList.toggle('on', pred(b.dataset.v)));
/* 收起两个多选面板(点页面空白/Escape/切换语言 三处共用) */
const closeMsPanels = () => { $('#src-ms-panel').hidden = true; $('#mdl-ms-panel').hidden = true; };
function segBind(id, key, cast, after) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $(id).querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    const change = () => { state[key] = cast ? cast(b.dataset.v) : b.dataset.v; };
    if (['win', 'metric', 'group'].includes(key)) changeQueryIntent(change); else change();
    (after || render)();
  });
}
segBind('#seg-range', 'win', String, () => { render(); });
segBind('#seg-metric', 'metric');
segBind('#seg-group', 'group');

for (const [id, key] of [['rs-pick', 'rs'], ['re-pick', 're']]) {
  $('#'+id).addEventListener('input', e => editCustomDate(key, e.target.value, false));
  $('#'+id).addEventListener('change', e => editCustomDate(key, e.target.value, true));
}

/* 单日钻取:日期选择器 / 前后天 / 返回 */
/* 动态档归一(2026-10-19 交互审计):钻到"今天/昨天"的日期串时回落到动态档——
   否则 prev→next 往返后 win='YYYY-MM-DD',"今天"档高亮丢失、"返回今天"按钮在当天仍挂着 */
const normDayWin = d => d === localDayStr() ? 'today' : (d === addDay(localDayStr(), -1) ? 'yesterday' : d);
function enterDay(d) { changeQueryIntent(() => { state.win = normDayWin(d); }); render(); }
function shiftDay(n) {
  const minD = daysAll[0], maxD = daysAll[daysAll.length - 1];
  const d = addDay(winDay(), n);
  if (d < minD || d > maxD) return;
  enterDay(d);
}
$('#day-pick').addEventListener('change', e => { if (e.target.value) enterDay(e.target.value); });
$('#day-prev').addEventListener('click', () => shiftDay(-1));
$('#day-next').addEventListener('click', () => shiftDay(1));
$('#day-back').addEventListener('click', () => enterDay(localDayStr()));
/* 表行键盘可达:Enter/Space 与点击一致，默认 solo，Ctrl/⌘ 多选切换。 */
for (const [sel, dim] of [['#tbl-source', 'src'], ['#tbl-model', 'mdl']]) {
  $(sel).addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const tr = e.target.closest('tr.srcrow, tr.mrow');
    if (!tr) return;
    e.preventDefault();
    if (dim === 'src') (e.ctrlKey||e.metaKey?toggleSrc:soloSrc)(tr.dataset.s);
    else (e.ctrlKey||e.metaKey?toggleMdl:soloMdl)(tr.dataset.m);
  });
}

/* 下拉开关(两个面板互不影响,点页面其他处全部收起) */
function bindMsToggle(btnId, panelId, builder) {
  $(btnId).addEventListener('click', e => {
    e.stopPropagation();
    const panel = $(panelId);
    const other = panelId === '#src-ms-panel' ? $('#mdl-ms-panel') : $('#src-ms-panel');
    other.hidden = true;
    if (panel.hidden) { panel.dataset.q = ''; builder(); panel.hidden = false; }
    else panel.hidden = true;
  });
  $(panelId).addEventListener('click', e => e.stopPropagation());
}
bindMsToggle('#src-ms-btn', '#src-ms-panel', () => buildFilterPanel('source'));
bindMsToggle('#mdl-ms-btn', '#mdl-ms-panel', () => buildFilterPanel('model'));
document.addEventListener('click', closeMsPanels);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMsPanels(); });

/* ---- 单位制切换:万/亿 ↔ K/M/B,全站格式化即时切换 ---- */
function setUnitUi() { segSync('#seg-unit', v => v === state.unit); }
$('#tbl-source').addEventListener('click', e => { const tr = e.target.closest('tr.srcrow'); if (!tr) return; (e.ctrlKey || e.metaKey) ? toggleSrc(tr.dataset.s) : soloSrc(tr.dataset.s); });
/* 表行点击:默认 solo(只看该模型);⌘/Ctrl+点击 = 多选切换(补上表格内被 solo 取代的加选/取消入口) */
$('#tbl-model').addEventListener('click', e => { const tr = e.target.closest('tr.mrow'); if (!tr) return; (e.ctrlKey || e.metaKey) ? toggleMdl(tr.dataset.m) : soloMdl(tr.dataset.m); });
segBind('#seg-unit', 'unit', String, () => {
  lsSet(UNIT_LS_KEY, state.unit);
  setUnitUi();
  if (DATA && DATA.ready) render();   // 扫描期防裸 render(单位开关与语言切换同款守卫)
});

/* ---- 语言切换:高亮先行,六步链见 setLang ---- */
$('#seg-lang').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  segSync('#seg-lang', v => v === b.dataset.v);
  setLang(b.dataset.v);
});


function applyArf() {
  const gen = ++arfGen;
  clearTimeout(arfTimer);
  /* 手动读库的忙碌状态由自身操作收尾，切换自动刷新不取消正在读取的结果。 */
  if (!state.arf) { arfNextAt = 0; renderStatus(); return; }
  const schedule = () => {
    if (gen !== arfGen) return;   // 幽灵链防线:切档后旧链到此为止
    arfNextAt = Date.now() + state.arf * 1000;
    renderStatus();
    arfTimer = setTimeout(async () => {
      if (gen !== arfGen) return;
      // Hidden tabs skip ordinary reads. The server's configured collection
      // interval is independent; returning to the page fetches its latest data.
      // A manual refresh owns its database read; ordinary ticks must not cancel it
      // when multiple individually bounded queries outlast this interval.
      if (document.hidden || refreshBusy) { schedule(); return; }
      await load();
      schedule();   // schedule 入口再查 gen:await 挂起期间切档,链在此断掉
    }, Math.max(1000, state.arf * 1000));   // 下限 1s 兜底,任何路径都不会 0ms 自旋
  };
  schedule();
}
function setArfUi() { segSync('#seg-arf', v => Number(v) === state.arf); }
// 回前台/页面唤醒 → 立即补拉一次(修:hidden 暂停 tick 后,回前台若 arf=关或
// serve 曾重启,页面会停在旧快照"看起来没数据";无论 arf 档位,可见性恢复即拉最新)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if(typeof cancelWakeConfirmation==='function')cancelWakeConfirmation(); return; }
  /* 链死亡自愈(2026-10-17 修):挂死 fetch 等历史原因可能已让 arf 定时链停摆
     (唯一现场症状:状态栏倒计时卡住不动)。回前台无条件重建定时链——
     arfGen 代际守卫保证旧链(即使还活着)被安全取代,不会双链 */
  if (state.arf) applyArf();
  /* DATA==null(首连失败)也补拉:arf=关 且无 coldRetry 在途时,这是唯一自愈入口
     ;DATA 未就绪对象仍跳过,冷启动链归 coldRetry 管 */
  if (DATA === null || (DATA && DATA.ready)) {
    // 已有统计先保留；慢扫描和短暂断连由同一条安静补读链等待恢复。
    resumeDashboard();
  }
  // 后台标签 canvas 可能被浏览器缩为 0 尺寸 → 显式 resize 恢复(空白图诱因之二)
  requestAnimationFrame(() => {
    for (const k in charts) { try { charts[k].resize(); } catch (e) {} }
  });
});
window.addEventListener('pagehide', () => { if(typeof cancelWakeConfirmation==='function')cancelWakeConfirmation(); });
window.addEventListener('pageshow', e => { if (e.persisted && !document.hidden) resumeDashboard(); });


segBind('#seg-arf', 'arf', Number, () => {
  if(typeof cancelWakeConfirmation==='function')cancelWakeConfirmation();
  lsSet(ARF_LS_KEY, state.arf);
  setArfUi();
  applyArf();
  // 切“关”仍确认一次状态；只更新连接面板，不取图或启动重试链。
  if (state.arf === 0) {
    const generation=arfGen;
    readStatusV2('status?arf=0',undefined,()=>generation===arfGen).catch(() => {});
  }
});

/* 手动刷新只重读已保存的统计；采集周期由后台独立管理。 */
$('#btn-refresh').addEventListener('click', () => {
  if(typeof refreshSavedView==='function')refreshSavedView();
  else retryDashboardAdapter(true);
});
$('#clear-model-filter').addEventListener('click', () => {
  const dim=typeof selectionIssueDimension==='string'?selectionIssueDimension:'model';
  if(setSelection(dim,null,null,true))render();
});


/* ---------------- 启动 ---------------- */
/* 逐项独立恢复:任一存储项损坏(坏 JSON/旧格式残留)只丢该自身,不再连带吞掉其余恢复 */
const safe = fn => { try { fn(); } catch (e) {} };
safe(() => restoreSelection('source'));
safe(() => restoreSelection('model'));
safe(() => {  // 刷新间隔:键缺失时 Number(null)=0 会误命中"关"档——显式判空保默认 30s
  const aRaw = lsGet(ARF_LS_KEY);
  const a = aRaw === null ? NaN : Number(aRaw);
  if (a === 5 || a === 10) { state.arf = 20; } else if ([20, 30, 60, 0].includes(a)) state.arf = a;
});
safe(() => {  // 单位制:有显式存储值(用户点过开关)则恢复;否则跟随语言默认(zh→万/亿,en→K/M)
  const u = lsGet(UNIT_LS_KEY);
  if (u === 'zh' || u === 'en') state.unit = u;
  else state.unit = langDefaultUnit(state.lang);
});
/* 图表模式不恢复:每次开页使用标准图,3D 由用户在当前页手动开启。 */
/* 时间窗不恢复:刷新永远默认"今天"(用户决策;单日钻取本就是临时态,档位选择也不跨会话) */
applyStaticI18n();   // 首帧前替换静态文案 + 同步 <html lang> 与 <title>
setLangUi();
setArfUi();
setUnitUi();
if (chartLibOk) chartBase();
// This loader belongs to the small base UI, so an absent adapter cannot leave
// the initial loading screen indefinitely. Never re-evaluate a parsed adapter:
// its top-level lexical bindings are not safe to define twice.
let adapterRetryCount=0,adapterRetryTimer=null,adapterRetryPending=false;
function retryDashboardAdapter(manual=false) {
  if(typeof load==='function')return;
  if(manual){adapterRetryCount=0;clearTimeout(adapterRetryTimer);adapterRetryTimer=null;}
  if(adapterRetryPending||adapterRetryTimer!==null)return;
  const failed=adapterRetryCount>=3;
  $('#status').textContent=(failed?t('status.scriptFailed'):t('status.scriptRetry'));
  $('#status').title=t('status.scriptHint');
  $('#scanning-txt').textContent=(failed?t('status.scriptFailed'):t('status.scriptRetry'));
  if(failed)return;
  adapterRetryTimer=setTimeout(()=>{
    adapterRetryTimer=null;
    if(typeof load==='function')return;
    adapterRetryCount++;adapterRetryPending=true;
    const script=document.createElement('script');
    script.src='/dashboard_v2.js?retry='+adapterRetryCount;script.async=true;
    const settled=()=>{adapterRetryPending=false;script.remove();retryDashboardAdapter();};
    script.onload=settled;script.onerror=settled;
    document.body.appendChild(script);
  },[1000,3000,10000][adapterRetryCount]);
}
window.addEventListener('load',()=>retryDashboardAdapter());
</script>
